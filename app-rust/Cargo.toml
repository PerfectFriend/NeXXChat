[package]
name = "nexxapp"
version = "0.2.0"
edition = "2021"

[lib]
name = "nexxapp"
crate-type = ["cdylib"]

[dependencies]
nexxrust = { path = "../rustcore" }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde_json = "1"
rand = "0.8"
android-activity = { version = "0.6", features = ["native-activity"] }
winit = "0.30"
egui = "0.29"
egui-winit = { version = "0.29", default-features = false }
egui-wgpu = "0.29"
wgpu = "22"
pollster = "0.3"
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = 2
strip = true
