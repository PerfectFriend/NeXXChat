[package]
name = "nexxrust"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexxrust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
base64 = "0.22"
serde_json = "1"
rand = "0.8"
libc = "0.2"
k256 = { version = "0.13", features = ["arithmetic"] }
ed25519-dalek = "2"
sha3 = "0.10"
bs58 = "0.5"
ripemd = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
crypto_secretbox = "0.1"
hkdf = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "0.26"
# Android: собираем OpenSSL из исходников (vendored) — в NDK готовой libssl нет.
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
openssl = "0.10"
tokio-openssl = "0.6.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
h2 = "0.4"
http = "1"
bytes = "1"
futures = "0.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
